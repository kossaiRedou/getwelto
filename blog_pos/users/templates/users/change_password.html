{% extends 'base.html' %}
{% load welto %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="mx-auto max-w-md">
  <h1 class="mb-4 text-xl font-bold">{{ title }}</h1>
  <form method="post" class="card space-y-4 p-5">{% csrf_token %}
    {% include 'partials/form_errors.html' %}
    {% for field in form %}{% include 'partials/field.html' %}{% endfor %}
    <div class="flex justify-end gap-2 border-t border-slate-100 pt-4">
      <a href="{% url 'pos' %}" class="btn btn-light">Annuler</a>
      <button class="btn btn-primary">{% icon 'check' 'h-4 w-4' %} Enregistrer</button>
    </div>
  </form>
</div>
{% endblock %}
