{% load static %}<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3d35e6">
  <title>{% block title %}{% endblock %} · {{ company_name|default:"WELTO" }}</title>
  <link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <script src="{% static 'js/app.js' %}" defer></script>
</head>
<body class="min-h-dvh bg-navy-950 bg-[radial-gradient(ellipse_at_top,var(--color-brand-800),transparent_60%)]">
  <main class="mx-auto flex min-h-dvh w-full {% block width %}max-w-md{% endblock %} flex-col justify-center px-4 py-10">
    <div class="mb-8 flex items-center justify-center gap-3">
      <span class="logo-mark h-11 w-11 text-xl">W</span>
      <span class="text-xl font-bold tracking-tight text-white">{{ company_name|default:"WELTO" }}</span>
    </div>
    <div class="rounded-3xl bg-white p-6 shadow-2xl shadow-black/30 sm:p-8">
      {% include 'partials/messages.html' %}
      {% block content %}{% endblock %}
    </div>
    {% block below %}{% endblock %}
    <p class="mt-8 text-center text-xs text-slate-500">WELTO · caisse et gestion de boutique</p>
  </main>
</body>
</html>
