<div class="{{ class|default:'' }}">
  {% if field.field.widget.input_type == 'checkbox' %}
  <label class="flex items-center gap-3 py-1 text-sm font-medium text-slate-700">{{ field }} {{ field.label }}</label>
  {% else %}
  <label for="{{ field.id_for_label }}" class="label">{{ field.label }}{% if field.field.required %} <span class="text-rose-500">*</span>{% endif %}</label>
  {{ field }}
  {% endif %}
  {% if field.help_text %}<p class="mt-1 text-xs text-slate-500">{{ field.help_text }}</p>{% endif %}
  {% for error in field.errors %}<p class="mt-1 text-xs font-medium text-rose-600">{{ error }}</p>{% endfor %}
</div>
